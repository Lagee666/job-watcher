[package]
name = "job-watcher"
version = "0.1.0"
edition = "2024"
default-run = "job-watcher"

[workspace]
resolver = "3"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.21"
chrono = { version = "0.4", features = ["clock"] }
dotenvy = "0.15"
headless_chrome = "1"
rustls = "0.23"
serde = "1"
serde_json = "1"
reqwest = { version = "0.13.0", features = ["blocking", "json", "query", "form"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "1.0"
yup-oauth2 = { version = "12.1", features = ["hyper-rustls"] }
